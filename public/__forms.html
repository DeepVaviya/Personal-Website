<!-- 
  This hidden form exists ONLY for Netlify's build bot to detect.
  Netlify's bot scans static HTML at deploy-time to register forms.
  Since the real form is rendered by React client-side, the bot can't see it.
  This file acts as the "registration" for the form.
-->
<form name="contact" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
</form>
